name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/example/usdinrcalculator
          mkdir -p app/src/main/res/values

          if [ -f MainActivity.kt ]; then
            mv MainActivity.kt app/src/main/java/com/example/usdinrcalculator/MainActivity.kt
          fi

          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ -f styles.xml ]; then
            mv styles.xml app/src/main/res/values/styles.xml
          fi

          if [ -f build.gradle.kts ] && [ ! -f app/build.gradle.kts ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USD-INR-Calculator-APK
          path: app/build/outputs/apk/debug/app-debug.apk